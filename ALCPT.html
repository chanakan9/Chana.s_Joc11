<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALCPT Practice Center — ชุดที่ 81–100</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --border: #dce4ee;
      --border-strong: #cbd5e1;
      --ink: #0f172a;
      --navy: #092b4c;
      --muted: #64748b;
      --brand: #2563eb;
      --brand-hover: #1d4ed8;
      --brand-soft: #eff6ff;
      --brand-border: #bfdbfe;
      --success: #10b981;
      --success-bg: #d1fae5;
      --success-ink: #065f46;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --danger-ink: #991b1b;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 4px 10px -4px rgba(15, 23, 42, 0.04);
      --font: "Inter", "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 0 110px 0;
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .app-header {
      background: linear-gradient(180deg, #e8f1fa 0%, var(--bg) 100%);
      padding: 32px 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }

    .hero-eyebrow {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--brand);
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .hero-title {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      margin: 0 auto 22px;
      max-width: 620px;
      font-size: 15px;
      color: var(--muted);
    }

    .form-selector-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 10px;
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 8px;
    }

    .form-pill {
      appearance: none;
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      padding: 9px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--navy);
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }

    .form-pill:hover {
      border-color: var(--brand);
      background: var(--brand-soft);
      color: var(--brand);
    }

    .form-pill:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .form-pill.is-active {
      background: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    .form-pill.is-empty:not(.is-active) {
      color: var(--muted);
      background: #f8fafc;
      border-style: dashed;
    }

    /* Active Form Toolbar */
    .quiz-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 18px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .quiz-toolbar-info h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
    }

    .quiz-toolbar-meta {
      margin: 2px 0 0;
      font-size: 13.5px;
      color: var(--muted);
    }

    .btn-reset {
      appearance: none;
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--navy);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-reset:hover {
      background: var(--surface-soft);
      border-color: var(--navy);
    }

    .btn-reset:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    /* Section Divider */
    .section-banner {
      margin: 24px 0 14px;
      padding: 10px 16px;
      background: #e8f0f8;
      border-left: 4px solid var(--navy);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 0.01em;
    }

    /* Question Card */
    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .question-card {
      background-color: var(--surface);
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      scroll-margin-top: 20px;
    }

    .question-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .question-badge {
      display: inline-flex;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--brand);
      background: var(--brand-soft);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .question-type-tag {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .prompt-box {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .prompt-text {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.55;
      white-space: pre-line;
    }

    .transcript-box {
      display: none;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-strong);
    }

    .transcript-box.is-open {
      display: block;
    }

    .audio-wrap {
      width: 100%;
    }

    .audio-wrap audio {
      width: 100%;
      height: 42px;
      display: block;
    }

    .btn-transcript {
      appearance: none;
      margin-top: 10px;
      padding: 6px 12px;
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--brand);
      background: var(--surface);
      border: 1px solid var(--brand-border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-transcript:hover {
      background: var(--brand-soft);
      border-color: var(--brand);
    }

    /* Choices */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .choice-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background-color: var(--surface);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      position: relative;
    }

    .choice-item:hover {
      background-color: #f8fbff;
      border-color: #93c5fd;
    }

    .choice-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .choice-item input[type="radio"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--brand);
      cursor: pointer;
      flex-shrink: 0;
    }

    .choice-item label {
      font-size: 15.2px;
      font-weight: 500;
      color: var(--navy);
      cursor: pointer;
      flex: 1;
      line-height: 1.45;
      word-break: break-word;
    }

    .correct-icon {
      display: none;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .explanation-box {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      background: #f0f9ff;
      border-left: 4px solid #0284c7;
      border-radius: 6px;
      font-size: 14px;
      color: #0c4a6e;
      line-height: 1.55;
    }

    .explanation-box.is-visible {
      display: block;
    }

    /* Done Check Score Button */
    .done-action-wrap {
      text-align: center;
      margin: 44px 0 20px;
    }

    .btn-check-score {
      appearance: none;
      font: inherit;
      padding: 18px 40px;
      font-size: 19px;
      font-weight: 700;
      background-color: var(--brand);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 18px -3px rgba(37, 99, 235, 0.35);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn-check-score:hover {
      background-color: var(--brand-hover);
      transform: translateY(-1px);
    }

    .btn-check-score:active {
      transform: translateY(0);
    }

    .btn-check-score:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    /* Score Summary Card */
    .result-summary-card {
      background-color: #f8fafc;
      border: 2px solid var(--border-strong);
      padding: 28px 24px;
      border-radius: var(--radius-lg);
      max-width: 640px;
      margin: 28px auto;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .result-summary-title {
      margin: 0 0 12px;
      color: #1e293b;
      font-size: 22px;
      font-weight: 700;
    }

    .result-summary-score {
      font-size: 32px;
      color: var(--brand);
      margin: 12px 0 6px;
      font-weight: 600;
    }

    .result-summary-percent {
      font-size: 17px;
      color: var(--muted);
      margin: 0 0 20px;
    }

    .wrong-list-box {
      text-align: left;
      background-color: #ffffff;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #fca5a5;
    }

    .wrong-list-title {
      display: block;
      color: var(--danger);
      font-weight: 700;
      font-size: 15.5px;
      margin-bottom: 10px;
    }

    .wrong-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .wrong-chip {
      appearance: none;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: var(--danger-ink);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .wrong-chip:hover {
      background: #fee2e2;
    }

    /* Empty State for Forms 82–100 */
    .empty-state-card {
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 48px 24px;
      text-align: center;
      margin: 24px 0;
    }

    .empty-state-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .empty-state-title {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
    }

    .empty-state-desc {
      margin: 0 auto 20px;
      max-width: 480px;
      font-size: 14.5px;
      color: var(--muted);
    }

    .btn-back-81 {
      appearance: none;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--brand);
      color: #ffffff;
      cursor: pointer;
    }

    .btn-back-81:hover {
      background: var(--brand-hover);
    }

    /* Floating Real-time Scoreboard */
    #realtime-scoreboard {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #1e293b;
      color: #ffffff;
      padding: 14px 22px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.35);
      font-family: var(--font);
      font-size: 17px;
      font-weight: 700;
      z-index: 9999;
      border: 1px solid rgba(255, 255, 255, 0.1);
      line-height: 1.35;
    }

    #realtime-scoreboard .score-num {
      color: #34d399;
      font-size: 23px;
    }

    #realtime-scoreboard .answered-sub {
      display: block;
      font-size: 13px;
      font-weight: 400;
      color: #cbd5e1;
      margin-top: 2px;
    }

    @media (max-width: 640px) {
      .app-header {
        padding: 20px 12px 16px;
      }
      .container {
        padding: 0 12px;
      }
      .hero-card {
        padding: 20px 16px;
      }
      .form-grid {
        grid-template-columns: repeat(auto-fill, minmax(66px, 1fr));
        gap: 6px;
      }
      .form-pill {
        font-size: 12.5px;
        padding: 8px 4px;
      }
      .question-card {
        padding: 16px 14px;
      }
      .choice-item {
        padding: 12px;
      }
      .btn-check-score {
        width: 100%;
        padding: 16px 24px;
        font-size: 17px;
      }
      #realtime-scoreboard {
        bottom: 12px;
        right: 12px;
        padding: 10px 16px;
        font-size: 15px;
      }
      #realtime-scoreboard .score-num {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="container">
      <div class="hero-card">
        <span class="hero-eyebrow">ALCPT Practice Hub</span>
        <h1 class="hero-title">คลังข้อสอบ ALCPT ชุดที่ 81 – 100</h1>
        <p class="hero-subtitle">เลือกชุดข้อสอบที่ต้องการฝึกซ้อม ตรวจคำตอบทันทีรายข้อ พร้อมสรุปคะแนนแบบเรียลไทม์</p>
        <span class="form-selector-label">เลือกชุดข้อสอบ (Form 81 – Form 100)</span>
        <div class="form-grid" id="form-selector-grid" role="tablist" aria-label="เลือกชุดข้อสอบ ALCPT"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="quiz-toolbar" class="quiz-toolbar">
      <div class="quiz-toolbar-info">
        <h2 id="active-form-title">ALCPT Form 81</h2>
        <p id="active-form-meta" class="quiz-toolbar-meta">Listening (ข้อ 1–66) + Reading (ข้อ 67–100) • รวม 100 ข้อ</p>
      </div>
      <button type="button" id="btn-reset-quiz" class="btn-reset" onclick="resetCurrentForm()">เริ่มทำชุดนี้ใหม่ ↻</button>
    </div>

    <div id="quiz-main-area"></div>

    <div id="done-button-area" class="done-action-wrap">
      <button type="button" class="btn-check-score" onclick="checkScore()">
        Done! คลิกเพื่อตรวจคะแนน 📊
      </button>
    </div>

    <div id="score-result"></div>
  </main>

  <div id="realtime-scoreboard" aria-live="polite"></div>

  <script>
    const AUDIO_BASE = "https://acelangvox.com/wp-content/uploads/2024/10/";

    // ข้อมูลข้อสอบ ALCPT แยกตามเลขชุด (81 - 100)
    // ชุดที่ 81 ดึงข้อมูลครบทั้ง 100 ข้อจากไฟล์ต้นฉบับ
    const FORMS_DATA = {
      81: [
        { q: "1. Henry wants to know the height of the building.\nWhat does Henry want to know?", audio: "New-Recording-86.m4a", choices: ["how tall it is", "how much it cost", "where it is located", "why it was built"], ans: 0 },
        { q: "2. Mr. Johnson uses a barometer in his work.\nWhat does he do?", audio: "New-Recording-2-21.m4a", choices: ["He sells groceries.", "He cuts down trees.", "He takes pictures.", "He studies the weather."], ans: 3 },
        { q: "3. What did dinner consist of?", audio: "New-Recording-3-21.m4a", choices: ["officers and men", "meat and vegetables", "five dollars bill", "one hour"], ans: 1 },
        { q: "4. Mr. Kim was making a deposit.\nWhere was he?", audio: "New-Recording-4-21.m4a", choices: ["in a gas station", "in a bank", "at a storage tank", "at a bench"], ans: 1 },
        { q: "5. The Smiths manufacture rugs.", audio: "New-Recording-5-21.m4a", choices: ["They buy rugs.", "They clean rugs.", "They make rugs.", "They repair rugs."], ans: 2 },
        { q: "6. Susan has finished her letter.", audio: "New-Recording-6-21.m4a", choices: ["She has been writing.", "She has been talking.", "She has been eating.", "She has been bathing."], ans: 0 },
        { q: "7. Jackson Street's the Main Street.", audio: "New-Recording-7-21.m4a", choices: ["It's the prettiest street.", "It's the principal street.", "It's the oldest street.", "its the next street."], ans: 1 },
        { q: "8. The strong coffee kept Angela awake all night. She couldn't ____________.", audio: "New-Recording-8-21.m4a", choices: ["drive", "sleep", "study", "eat"], ans: 1 },
        { q: "9. Lieutenant Barnhill was the security officer for his unit. He was responsible for the __________.", audio: "New-Recording-9-21.m4a", choices: ["condition of the building", "health of the men", "safety of the organization", "payment of the men"], ans: 2 },
        { q: "10. Rodney said Let's stop at a motel. Rodney is probably ____________.", audio: "New-Recording-10-22.m4a", choices: ["tall", "tired", "angry", "ugly"], ans: 1 },
        { q: "11. Colonel Manning can't take the quiz.", audio: "New-Recording-11-21.m4a", choices: ["mail", "test", "book", "call"], ans: 1 },
        { q: "12. Which of these is made of steel?", audio: "New-Recording-12-21.m4a", choices: ["a cigarette", "candy", "a book", "a car"], ans: 3 },
        { q: "13. There are many caution signs along the highway.\nWhat do these signs mean?", audio: "New-Recording-13-21.m4a", choices: ["to drive dangerously", "to turn around", "to drive carefully", "to stop at once"], ans: 2 },
        { q: "14. The student asked, Where can I catch the bus?\nThe instructor said, The bus stop is across the street.", audio: "New-Recording-14-21.m4a", choices: ["The bus will stop at the next street.", "The bus will stop on the other side of the street.", "The bus will stop at the next corner.", "The bus will stop right here."], ans: 1 },
        { q: "15. The movie is absolutely free.", audio: "New-Recording-15-21.m4a", choices: ["The tax has to be paid.", "It is very cheap.", "Nobody has to pay.", "It can't be free."], ans: 2 },
        { q: "16. He found a mistake in the letter.", audio: "New-Recording-16-21.m4a", choices: ["The letter had an error.", "He found the letter closed.", "He found a stamp inside the letter.", "The letter was perfect."], ans: 0 },
        { q: "17. That idea is very important.", audio: "New-Recording-17-21.m4a", choices: ["It is known by many people.", "It is difficult to understand.", "It has great value.", "It has a long history."], ans: 2 },
        { q: "18. He had bad luck yesterday morning.", audio: "New-Recording-18-21.m4a", choices: ["He lost his wallet.", "He was given a pay raise.", "He received a gift.", "He ate breakfast."], ans: 0 },
        { q: "19. Mr. Kelly doesn't know those students.\nMr. Watkins doesn't either.", audio: "New-Recording-19-21.m4a", choices: ["Kelly and Watkins don't know the students.", "Mr. Kelly knows those students.", "Mr. Watkins knows chose students.", "One knows the students and the other doesn't."], ans: 0 },
        { q: "20. He was afraid of it.", audio: "New-Recording-20-22.m4a", choices: ["He liked it.", "He added to it.", "It made him comfortable.", "It frightened him."], ans: 3 },
        { q: "21. The boy covered his head because it was so cold.", audio: "New-Recording-21-22.m4a", choices: ["He put on a hat.", "He put on boots.", "He put on gloves.", "He put on a sweater."], ans: 0 },
        { q: "22. A watch repairman at the shop checked Joe's watch and said, I can't guarantee to make it run.", audio: "New-Recording-22-22.m4a", choices: ["The repairman cannot promise to fix the watch.", "This repairman is not at the shop.", "Joe repaired his watch.", "The repairman promised to have the watch fixed."], ans: 0 },
        { q: "23. I go to school because it is compulsory.", audio: "New-Recording-23-22.m4a", choices: ["Boys and girls go together.", "It is interesting.", "It is required.", "It is free for me."], ans: 2 },
        { q: "24. Miss Jones is an efficient secretary.", audio: "New-Recording-24-22.m4a", choices: ["Miss Jones doesn't like her work.", "Miss Jones does good, fast work.", "Miss Jones does very sloppy work.", "Miss Jones doesn't finish her work."], ans: 1 },
        { q: "25. Henry compared the two books.", audio: "New-Recording-25-22.m4a", choices: ["He bought them together.", "He returned them together.", "He found them together.", "He examined them together."], ans: 3 },
        { q: "26. Sylvia is mentally ill.", audio: "New-Recording-26-22.m4a", choices: ["Her heart is weak.", "Her leg is broken.", "Her mind is disturbed.", "Her fever is elevated."], ans: 2 },

    // สร้างช่องข้อมูลชุดที่ 82 ถึง 100 ไว้รองรับการเพิ่มข้อสอบ
    for (let f = 82; f <= 100; f++) {
      if (!FORMS_DATA[f]) {
        FORMS_DATA[f] = [];
      }
    }

    let activeForm = 81;
    let currentScore = 0;
    let answeredQuestions = 0;
    let totalQuestions = 0;

    function buildFormSelector() {
      const grid = document.getElementById("form-selector-grid");
      grid.innerHTML = "";
      for (let f = 81; f <= 100; f++) {
        const hasData = FORMS_DATA[f] && FORMS_DATA[f].length > 0;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.role = "tab";
        btn.ariaSelected = f === activeForm ? "true" : "false";
        btn.className = "form-pill" + (f === activeForm ? " is-active" : "") + (!hasData ? " is-empty" : "");
        btn.textContent = "ชุดที่ " + f;
        btn.onclick = () => selectForm(f);
        grid.appendChild(btn);
      }
    }

    function selectForm(formNum) {
      // หยุดเสียงที่กำลังเล่นอยู่ก่อนเปลี่ยนชุด
      document.querySelectorAll("audio").forEach(a => {
        a.pause();
        a.currentTime = 0;
      });
      activeForm = formNum;
      buildFormSelector();
      renderFormQuiz(formNum);
    }

    function resetCurrentForm() {
      document.querySelectorAll("audio").forEach(a => {
        a.pause();
        a.currentTime = 0;
      });
      renderFormQuiz(activeForm);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateScoreDisplay() {
      const scoreBoard = document.getElementById("realtime-scoreboard");
      if (totalQuestions === 0) {
        scoreBoard.style.display = "none";
        return;
      }
      scoreBoard.style.display = "block";
      scoreBoard.innerHTML = `⭐ คะแนน: <span class="score-num">${currentScore}</span> / ${totalQuestions}` +
        `<span class="answered-sub">ทำแล้ว ${answeredQuestions} ข้อ</span>`;
    }

    function renderFormQuiz(formNum) {
      const questions = FORMS_DATA[formNum] || [];
      const mainArea = document.getElementById("quiz-main-area");
      const doneArea = document.getElementById("done-button-area");
      const resultDiv = document.getElementById("score-result");
      const titleEl = document.getElementById("active-form-title");
      const metaEl = document.getElementById("active-form-meta");
      const resetBtn = document.getElementById("btn-reset-quiz");

      titleEl.textContent = `ALCPT Form ${formNum} (ชุดที่ ${formNum})`;
      resultDiv.innerHTML = "";

      currentScore = 0;
      answeredQuestions = 0;
      totalQuestions = questions.length;
      updateScoreDisplay();

      if (questions.length === 0) {
        metaEl.textContent = "ยังไม่มีข้อมูลข้อสอบในชุดนี้";
        resetBtn.style.display = "none";
        doneArea.style.display = "none";
        mainArea.innerHTML = `
          <div class="empty-state-card">
            <div class="empty-state-icon">📂</div>
            <h3 class="empty-state-title">ยังไม่มีข้อสอบในชุดที่ ${formNum}</h3>
            <p class="empty-state-desc">
              ขณะนี้มีข้อมูลครบทั้ง 100 ข้อใน <strong>ชุดที่ 81 – 82</strong> แล้ว คุณสามารถนำข้อมูลข้อสอบของชุดที่ ${formNum} มาใส่เพิ่มในตัวแปร <code>FORMS_DATA[${formNum}]</code> ในโค้ดเพื่อใช้งานระบบตรวจคะแนนเดียวกันได้ทันที
            </p>
            <button type="button" class="btn-back-81" onclick="selectForm(81)">กลับไปทำชุดที่ 81</button>
          </div>
        `;
        return;
      }

      const listeningCount = questions.filter(item => Boolean(item.audio)).length;
      const readingCount = questions.length - listeningCount;
      metaEl.textContent = `Listening ${listeningCount} ข้อ • Reading ${readingCount} ข้อ • รวม ${questions.length} ข้อ (สลับช้อยส์อัตโนมัติตั้งแต่ข้อ 14 เป็นต้นไป)`;
      resetBtn.style.display = "inline-block";
      doneArea.style.display = "block";

      const listContainer = document.createElement("div");
      listContainer.className = "questions-list";

      let addedListeningBanner = false;
      let addedReadingBanner = false;

      questions.forEach((item, index) => {
        const questionNumber = index + 1;
        const isListening = Boolean(item.audio);

        if (isListening && !addedListeningBanner) {
          addedListeningBanner = true;
          const banner = document.createElement("div");
          banner.className = "section-banner";
          banner.textContent = "🎧 Part I: Listening (ข้อ 1 – " + listeningCount + ")";
          listContainer.appendChild(banner);
        } else if (!isListening && !addedReadingBanner) {
          addedReadingBanner = true;
          const banner = document.createElement("div");
          banner.className = "section-banner";
          banner.textContent = "📖 Part II: Reading (ข้อ " + questionNumber + " – " + questions.length + ")";
          listContainer.appendChild(banner);
        }

        const card = document.createElement("div");
        card.className = "question-card";
        card.id = `question-card-${questionNumber}`;
        card.dataset.isAnswered = "false";
        card.dataset.questionNumber = String(questionNumber);

        // ส่วนหัวข้อสอบ
        const qHeader = document.createElement("div");
        qHeader.className = "question-header";
        qHeader.innerHTML = `
          <span class="question-badge">ข้อที่ ${questionNumber}</span>
          <span class="question-type-tag">${isListening ? "Listening" : "Reading"}</span>
        `;
        card.appendChild(qHeader);

        // กล่องโจทย์ / เครื่องเล่นเสียง
        const promptBox = document.createElement("div");
        promptBox.className = "prompt-box";

        if (isListening) {
          const transcriptDiv = document.createElement("div");
          transcriptDiv.className = "transcript-box";
          const p = document.createElement("p");
          p.className = "prompt-text";
          if (item.h) {
            p.innerHTML = item.q;
          } else {
            p.textContent = item.q;
          }
          transcriptDiv.appendChild(p);

          const audioWrap = document.createElement("div");
          audioWrap.className = "audio-wrap";
          const audioEl = document.createElement("audio");
          audioEl.controls = true;
          audioEl.preload = "none";
          audioEl.src = item.audio.startsWith("http")
            ? item.audio
            : (item.audio.includes("/")
              ? "https://acelangvox.com/wp-content/uploads/" + item.audio
              : AUDIO_BASE + item.audio);
          // หยุดเล่นไฟล์เสียงข้ออื่นเมื่อกดเล่นข้อปัจจุบัน
          audioEl.addEventListener("play", () => {
            document.querySelectorAll("audio").forEach(other => {
              if (other !== audioEl && !other.paused) {
                other.pause();
              }
            });
          });
          audioWrap.appendChild(audioEl);

          const toggleBtn = document.createElement("button");
          toggleBtn.type = "button";
          toggleBtn.className = "btn-transcript";
          toggleBtn.textContent = "Show Transcript";
          toggleBtn.setAttribute("aria-expanded", "false");
          toggleBtn.onclick = () => {
            const open = transcriptDiv.classList.toggle("is-open");
            toggleBtn.textContent = open ? "Hide Transcript" : "Show Transcript";
            toggleBtn.setAttribute("aria-expanded", open ? "true" : "false");
          };

          promptBox.appendChild(transcriptDiv);
          promptBox.appendChild(audioWrap);
          promptBox.appendChild(toggleBtn);
        } else {
          const p = document.createElement("p");
          p.className = "prompt-text";
          if (item.h) {
            p.innerHTML = item.q;
          } else {
            p.textContent = item.q;
          }
          promptBox.appendChild(p);
        }

        card.appendChild(promptBox);

        // ตัวเลือกคำตอบ (.choices-container & .choice-item)
        const choicesContainer = document.createElement("div");
        choicesContainer.className = "choices-container";

        // เตรียมข้อมูลช้อยส์พร้อมระบุข้อถูก
        const preparedChoices = item.choices.map((text, cIdx) => ({
          text: text,
          isCorrect: cIdx === item.ans
        }));

        // สลับช้อยส์อัตโนมัติ (ยกเว้นข้อ 1–13 ตามเงื่อนไข)
        if (questionNumber > 13) {
          for (let i = preparedChoices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [preparedChoices[i], preparedChoices[j]] = [preparedChoices[j], preparedChoices[i]];
          }
        }

        preparedChoices.forEach((choiceObj, radioIndex) => {
          const choiceEl = document.createElement("div");
          choiceEl.className = "choice-item";
          choiceEl.dataset.isCorrect = choiceObj.isCorrect ? "true" : "false";

          const radioId = `f${formNum}_q_${index}_choice_${radioIndex}`;
          const leftWrap = document.createElement("div");
          leftWrap.className = "choice-left";

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = `f${formNum}_question_group_${index}`;
          radio.id = radioId;

          const label = document.createElement("label");
          label.setAttribute("for", radioId);
          label.textContent = choiceObj.text;

          leftWrap.appendChild(radio);
          leftWrap.appendChild(label);

          const iconSpan = document.createElement("span");
          iconSpan.className = "correct-icon";
          iconSpan.textContent = choiceObj.isCorrect ? "✓ เฉลย" : "✕";

          // คลิกพื้นที่กรอบช้อยส์เพื่อเลือกปุ่ม Radio ได้สะดวกทั้งมือถือและคอมพิวเตอร์
          choiceEl.addEventListener("click", (ev) => {
            if (card.dataset.isAnswered === "true") return;
            if (ev.target !== radio && ev.target !== label) {
              radio.checked = true;
              radio.dispatchEvent(new Event("change", { bubbles: true }));
            }
          });

          choiceEl.appendChild(leftWrap);
          choiceEl.appendChild(iconSpan);
          choicesContainer.appendChild(choiceEl);
        });

        card.appendChild(choicesContainer);

        // กล่องคำอธิบาย (ถ้ามีในข้อสอบต้นฉบับ)
        let expBox = null;
        if (item.exp) {
          expBox = document.createElement("div");
          expBox.className = "explanation-box";
          expBox.textContent = "💡 " + item.exp;
          card.appendChild(expBox);
        }

        // Event Delegation ดักจับการตอบแต่ละข้อ
        choicesContainer.addEventListener("change", function (e) {
          if (e.target.type !== "radio") return;
          if (card.dataset.isAnswered === "true") return;

          card.dataset.isAnswered = "true";
          choicesContainer.style.setProperty("pointer-events", "none", "important");

          const selectedRadio = e.target;
          const selectedChoiceElement = selectedRadio.closest(".choice-item");
          const correctChoiceElement = card.querySelector('.choice-item[data-is-correct="true"]');

          if (correctChoiceElement) {
            correctChoiceElement.style.setProperty("background-color", "#d1fae5", "important");
            correctChoiceElement.style.setProperty("color", "#065f46", "important");
            correctChoiceElement.style.setProperty("border-left", "4px solid #10b981", "important");
            const lbl = correctChoiceElement.querySelector("label");
            if (lbl) lbl.style.setProperty("color", "#065f46", "important");
            const icon = correctChoiceElement.querySelector(".correct-icon");
            if (icon) {
              icon.style.setProperty("display", "inline", "important");
              icon.style.setProperty("color", "#065f46", "important");
            }
          }

          if (selectedChoiceElement === correctChoiceElement) {
            currentScore++;
            card.style.setProperty("border", "2px solid #10b981", "important");
          } else {
            if (selectedChoiceElement) {
              selectedChoiceElement.style.setProperty("background-color", "#fee2e2", "important");
              selectedChoiceElement.style.setProperty("color", "#991b1b", "important");
              selectedChoiceElement.style.setProperty("border-left", "4px solid #ef4444", "important");
              const lbl = selectedChoiceElement.querySelector("label");
              if (lbl) lbl.style.setProperty("color", "#991b1b", "important");
              const wrongIcon = selectedChoiceElement.querySelector(".correct-icon");
              if (wrongIcon) {
                wrongIcon.style.setProperty("display", "inline", "important");
                wrongIcon.style.setProperty("color", "#991b1b", "important");
              }
            }
            card.style.setProperty("border", "2px solid #ef4444", "important");
          }

          if (expBox) {
            expBox.classList.add("is-visible");
          }

          answeredQuestions++;
          updateScoreDisplay();

          if (answeredQuestions === totalQuestions) {
            showFinalResult();
          }
        });

        listContainer.appendChild(card);
      });

      mainArea.innerHTML = "";
      mainArea.appendChild(listContainer);
    }

    function jumpToQuestion(qNum) {
      const target = document.getElementById(`question-card-${qNum}`);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    function showFinalResult() {
      if (totalQuestions === 0) return;

      const resultDiv = document.getElementById("score-result");
      const allCards = document.querySelectorAll(".question-card");
      const wrongQuestions = [];

      allCards.forEach((card, index) => {
        const selectedRadio = card.querySelector('input[type="radio"]:checked');
        const correctChoiceElement = card.querySelector('.choice-item[data-is-correct="true"]');
        if (!selectedRadio || selectedRadio.closest(".choice-item") !== correctChoiceElement) {
          wrongQuestions.push(index + 1);
        }
      });

      const percent = Math.round((currentScore / totalQuestions) * 100);
      const unansweredCount = totalQuestions - answeredQuestions;

      const chipsHtml = wrongQuestions
        .map(num => `<button type="button" class="wrong-chip" onclick="jumpToQuestion(${num})" title="คลิกเพื่อเลื่อนไปดูข้อที่ ${num}">ข้อ ${num}</button>`)
        .join("");

      resultDiv.innerHTML = `
        <div class="result-summary-card">
          <h2 class="result-summary-title">📊 สรุปผลการทำข้อสอบ ALCPT ชุดที่ ${activeForm}</h2>
          <p class="result-summary-score">ได้คะแนนรวม: <strong>${currentScore}</strong> / ${totalQuestions} ข้อ</p>
          <p class="result-summary-percent">
            คิดเป็นเปอร์เซ็นต์: <strong>${percent}%</strong>
            ${unansweredCount > 0 ? ` • (ยังไม่ได้ตอบ ${unansweredCount} ข้อ)` : ""}
          </p>
          ${wrongQuestions.length > 0 ? `
            <div class="wrong-list-box">
              <span class="wrong-list-title">❌ ข้อที่ทำผิด / ยังไม่ได้ตอบ (${wrongQuestions.length} ข้อ) — คลิกเลขข้อเพื่อย้อนกลับไปดู:</span>
              <div class="wrong-chips">${chipsHtml}</div>
            </div>
          ` : `
            <p style="color: #10b981; font-size: 20px; font-weight: 700; margin: 0;">🎉 ยินดีด้วยครับ! คุณทำถูกหมดทุกข้อเลย!</p>
          `}
        </div>
      `;

      setTimeout(() => {
        resultDiv.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 200);
    }

    function checkScore() {
      showFinalResult();
    }

    // เริ่มต้นโหลดหน้าเว็บที่ชุดที่ 81
    buildFormSelector();
    renderFormQuiz(81);
  </script>
</body>
</html>
